<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD6E8">
<title>Активность канала</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #FFF0F6;
    --petal: #FFD6E8;
    --rose: #F472A8;
    --deep: #C2185B;
    --ink: #6B1D45;
    --soft: #A8567F;
    --lilac: #EBDCFF;
    --gold: #FFC857;
    --display: "Comfortaa", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font: 500 16px/1.45 var(--body);
    background:
      radial-gradient(900px 500px at 8% -8%, #FFD0E4 0%, transparent 60%),
      radial-gradient(700px 520px at 100% 22%, var(--lilac) 0%, transparent 55%),
      radial-gradient(800px 600px at 0% 100%, #FFE3D3 0%, transparent 55%),
      var(--blush);
    background-attachment: fixed;
    padding: 14px 14px calc(36px + env(safe-area-inset-bottom));
  }
  #app { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }

  /* ---------- фон: летящие сердечки и мерцающие блёстки ---------- */
  #fx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .fl { position: absolute; bottom: -40px; color: var(--rose); opacity: 0; animation: rise linear infinite; }
  @keyframes rise {
    0%   { transform: translate(0, 0) rotate(-8deg); opacity: 0; }
    10%  { opacity: .45; }
    90%  { opacity: .3; }
    100% { transform: translate(24px, -110vh) rotate(10deg); opacity: 0; }
  }
  .tw { position: absolute; line-height: 1; animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: .2; transform: scale(.7) rotate(0deg); }
    50%      { opacity: 1;  transform: scale(1.15) rotate(22deg); }
  }

  /* ---------- приветствие ---------- */
  .hero {
    position: relative; overflow: hidden;
    border-radius: 30px 30px 30px 8px;
    padding: 24px 20px 20px;
    background: linear-gradient(135deg, #FFB3D2 0%, #FFD6E8 55%, #EBDCFF 100%);
    box-shadow: 0 12px 26px rgba(214, 51, 108, .2);
    margin-bottom: 14px;
  }
  .hero h1 { font: 700 26px/1.15 var(--display); margin: 0 0 10px; color: #8E1B50; position: relative; }
  .timer {
    position: relative; display: inline-block;
    background: rgba(255, 255, 255, .7); border-radius: 999px;
    padding: 6px 14px; font-size: 14px; font-weight: 700; color: var(--ink);
  }

  /* ---------- карточки ---------- */
  .card {
    background: rgba(255, 255, 255, .82);
    border: 1.5px solid #FFCFE2;
    border-radius: 22px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .ttl { font: 700 17px/1.2 var(--display); margin: 0 0 12px; color: #8E1B50; }
  .ttl i { font-style: normal; color: var(--rose); margin-right: 4px; }
  .label-row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--soft); font-weight: 700; }
  .pts { font: 700 46px/1.1 var(--display); color: var(--deep); margin: 2px 0 0; }
  .pts small { font-size: 22px; color: var(--rose); margin-left: 6px; }

  .bar { position: relative; height: 14px; border-radius: 99px; background: #FFE0EC; margin: 14px 0 10px; box-shadow: inset 0 1px 3px rgba(194, 24, 91, .14); }
  .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #FFA3C8, #F0508F); position: relative; overflow: hidden; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .7) 50%, transparent 70%); transform: translateX(-100%); animation: sweep 2.8s ease-in-out infinite; }
  @keyframes sweep { to { transform: translateX(100%); } }
  .hrt { position: absolute; top: 50%; font-size: 22px; transform: translate(-50%, -52%); filter: drop-shadow(0 1px 2px rgba(194, 24, 91, .35)); transition: left .9s cubic-bezier(.2, .8, .2, 1); }
  .need { font-size: 14px; color: var(--soft); font-weight: 700; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: linear-gradient(160deg, #fff 0%, #FFEAF3 100%); border: 1.5px solid #FFD0E3; border-radius: 18px; padding: 12px 6px; text-align: center; }
  .tile b { display: block; font: 700 26px/1.1 var(--display); color: var(--deep); }
  .tile span { font-size: 13px; color: var(--soft); font-weight: 700; }

  /* ---------- колесо ---------- */
  .wheelcard {
    position: relative; overflow: hidden;
    border-radius: 34px; padding: 20px 16px 18px;
    background: linear-gradient(180deg, #fff 0%, #FFE6F1 100%);
    border: 2px solid #FFC2DB;
    box-shadow: 0 16px 32px rgba(240, 80, 143, .24);
    margin-bottom: 14px;
  }
  .wheelcard .ttl { text-align: center; font-size: 19px; position: relative; }
  .wheel-box { position: relative; width: min(74vw, 290px); margin: 30px auto 22px; aspect-ratio: 1; }
  .ring {
    position: absolute; inset: -14px; border-radius: 50%;
    background: repeating-conic-gradient(#fff 0 7.5deg, #FF8FB8 7.5deg 15deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
    filter: drop-shadow(0 0 6px rgba(255, 111, 165, .65));
    animation: spinring 30s linear infinite;
  }
  @keyframes spinring { to { transform: rotate(360deg); } }
  #wheel { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 4px #fff, 0 8px 20px rgba(194, 24, 91, .3); }
  .pointer { position: absolute; top: -32px; left: 50%; width: 42px; margin-left: -21px; z-index: 3; color: #E91E63; filter: drop-shadow(0 3px 3px rgba(194, 24, 91, .4)); }
  .pointer svg, .hub svg { display: block; width: 100%; height: auto; fill: currentColor; }
  .hub { position: absolute; top: 50%; left: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: #fff; border: 3px solid #FFB3D1; display: grid; place-items: center; color: #F0508F; z-index: 2; box-shadow: 0 2px 8px rgba(194, 24, 91, .3); }
  .hub svg { width: 22px; }

  #spinBtn {
    width: 100%; border: 0; border-radius: 18px; padding: 15px;
    font: 700 17px/1.2 var(--display); color: #fff;
    background: linear-gradient(135deg, #E8498A, #B8165A);
    box-shadow: 0 8px 18px rgba(184, 22, 90, .35);
    cursor: pointer; position: relative; overflow: hidden; transition: transform .15s;
  }
  #spinBtn:active:not(:disabled) { transform: scale(.97); }
  #spinBtn:disabled { background: #F0D3E1; color: #7A4A62; box-shadow: none; cursor: default; }
  #spinBtn:focus-visible, .tabs button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 5px var(--deep); }
  #msg { margin-top: 14px; min-height: 26px; text-align: center; font: 700 17px/1.3 var(--display); color: var(--deep); }

  /* ---------- рейтинг ---------- */
  .tabs { display: flex; gap: 4px; padding: 4px; background: #FFE5F0; border-radius: 99px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 8px 4px; border: 0; border-radius: 99px; background: transparent; color: var(--soft); font: 700 14px var(--body); cursor: pointer; }
  .tabs button.on { background: #fff; color: var(--deep); box-shadow: 0 2px 6px rgba(194, 24, 91, .18); }
  .top-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 14px; }
  .top-item .n { min-width: 30px; display: inline-block; }
  .top-item.me { background: #FFE0EC; font-weight: 800; color: var(--deep); }
  .cnt { background: #FFF0F6; border-radius: 99px; padding: 1px 10px; font-weight: 800; font-size: 14px; }

  /* ---------- призы ---------- */
  .prize { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1.5px dotted #FFC2DB; }
  .prize:last-child { border-bottom: 0; }
  .prize small { color: var(--soft); font-weight: 700; }
  .pc { flex: none; background: #FFE3EE; color: var(--deep); border-radius: 99px; padding: 2px 11px; font-weight: 800; font-size: 14px; }
  .empty { color: var(--soft); font-weight: 700; text-align: center; padding: 6px 0; }
  .center { text-align: center; padding: 60px 14px; color: var(--soft); font-weight: 700; }

  /* ---------- конфетти при выигрыше ---------- */
  .cf { position: fixed; font-size: 24px; z-index: 50; pointer-events: none; animation: pop 1.5s ease-out forwards; }
  @keyframes pop {
    0%   { transform: translate(0, 0) scale(.4) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fl, .tw, .ring, .fill::after { animation: none; }
    .fl { opacity: .25; }
    .tw { opacity: .7; }
  }
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div id="app" class="center">Загружаем твой профиль…</div>

<script>
// АДРЕС вашего Worker (без слэша на конце):
const API = "https://patient-term-2e28tg-activity-bot.mpe1425.workers.dev";

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#FFD6E8"); tg.setBackgroundColor("#FFF0F6"); } catch (e) {}
}
const initData = tg ? tg.initData : "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };
const BALL = ["балл", "балла", "баллов"];
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const SEG = ["#FFD1E3", "#FFEAF2", "#EBDCFF", "#FFE0D0", "#D9F3E8", "#FFC9DC"];

let data = null, wheelPrizes = [], rot = 0, topTab = "week", loadedAt = 0, spinning = false;

// ---------- фон ----------
function buildFx() {
  const box = $("fx"), hearts = ["♥", "♡", "♥"], stars = ["✦", "✧", "✦"], cols = ["#FFC857", "#F472A8", "#FFFFFF"];
  for (let i = 0; i < 9; i++) {
    const e = document.createElement("span"); e.className = "fl"; e.textContent = hearts[i % 3];
    e.style.left = Math.random() * 96 + "%"; e.style.fontSize = 14 + Math.random() * 18 + "px";
    e.style.animationDuration = 14 + Math.random() * 12 + "s"; e.style.animationDelay = -Math.random() * 20 + "s";
    box.appendChild(e);
  }
  for (let i = 0; i < 14; i++) {
    const e = document.createElement("span"); e.className = "tw"; e.textContent = stars[i % 3];
    e.style.left = Math.random() * 96 + "%"; e.style.top = Math.random() * 96 + "%";
    e.style.fontSize = 10 + Math.random() * 10 + "px"; e.style.color = cols[i % 3];
    e.style.animationDelay = -Math.random() * 3 + "s"; e.style.animationDuration = 2 + Math.random() * 2 + "s";
    box.appendChild(e);
  }
}

function burst() {
  if (reduced) return;
  const r = $("wheel").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const em = ["💗", "✨", "💖", "🌸", "⭐", "💕"];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span"); s.className = "cf"; s.textContent = em[i % em.length];
    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 150;
    s.style.left = cx + "px"; s.style.top = cy + "px";
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist - 40 + "px");
    s.style.setProperty("--rot", Math.random() * 120 - 60 + "deg");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1600);
  }
}

// ---------- данные ----------
async function call(path) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData }) });
  return r.json();
}

function left(sec) {
  if (sec <= 0) return "0 мин";
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  return (d ? d + " д " : "") + (h ? h + " ч " : "") + m + " мин";
}

function campaignText() {
  const c = data.campaign, nowSrv = c.now + (Date.now() / 1000 - loadedAt);
  return c.active ? "✨ До конца кампании: " + left(c.end - nowSrv) : "Кампания сейчас не идёт: баллы пока не начисляются";
}

// ---------- экран ----------
function render() {
  const u = data.user, cost = data.spin_cost;
  const pct = Math.min(100, Math.round((u.points / cost) * 100)), need = Math.max(0, cost - u.points);
  const hx = Math.max(4, Math.min(96, pct));
  $("app").className = "";
  $("app").innerHTML = `
    <section class="hero">
      <span class="tw" style="top:12px;right:18px;font-size:22px;color:#fff">✦</span>
      <span class="tw" style="top:44px;right:52px;font-size:14px;color:#FFC857;animation-delay:-1s">✦</span>
      <span class="tw" style="bottom:16px;right:26px;font-size:18px;color:#fff;animation-delay:-2s">✧</span>
      <span class="tw" style="top:20px;right:96px;font-size:12px;color:#F472A8;animation-delay:-.5s">♥</span>
      <h1>Привет${u.name ? ", " + esc(u.name) : ""}! ♥</h1>
      <span class="timer" id="timer">${esc(campaignText())}</span>
    </section>

    <section class="card">
      <div class="label-row"><span>Твои баллы</span><span>Вращение — ${cost} ${plural(cost, BALL)}</span></div>
      <div class="pts">${u.points}<small>♥</small></div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div><span class="hrt" style="left:${hx}%">💗</span></div>
      <div class="need">${need ? "Ещё " + need + " " + plural(need, BALL) + ", и можно крутить колесо" : "Можно крутить колесо! ✨"}</div>
    </section>

    <section class="card">
      <h2 class="ttl"><i>♥</i> Твои комментарии</h2>
      <div class="stats">
        <div class="tile"><b>${data.counts.week}</b><span>за 7 дней</span></div>
        <div class="tile"><b>${data.counts.month}</b><span>за 30 дней</span></div>
        <div class="tile"><b>${data.counts.all}</b><span>всего</span></div>
      </div>
    </section>

    <section class="wheelcard">
      <span class="tw" style="top:14px;left:18px;font-size:18px;color:#FFC857">✦</span>
      <span class="tw" style="top:36px;right:24px;font-size:14px;color:#F472A8;animation-delay:-1.4s">✧</span>
      <span class="tw" style="bottom:70px;left:14px;font-size:14px;color:#F472A8;animation-delay:-.8s">♥</span>
      <h2 class="ttl">✨ Колесо призов ✨</h2>
      <div class="wheel-box">
        <div class="ring"></div>
        <div class="pointer">${HEART}</div>
        <canvas id="wheel" aria-label="Колесо призов"></canvas>
        <div class="hub">${HEART}</div>
      </div>
      <button id="spinBtn" type="button">Крутить колесо за ${cost} ${plural(cost, BALL)}</button>
      <div id="msg" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2 class="ttl"><i>♥</i> Самые активные</h2>
      <div class="tabs" id="tabs">
        <button type="button" data-t="week">7 дней</button><button type="button" data-t="month">30 дней</button><button type="button" data-t="all">Всё время</button>
      </div>
      <div id="top"></div>
    </section>

    <section class="card">
      <h2 class="ttl"><i>♥</i> Призы и шансы</h2>
      <div id="prizes"></div>
    </section>`;

  $("tabs").onclick = (e) => { if (e.target.dataset.t) { topTab = e.target.dataset.t; renderTop(); } };
  $("spinBtn").onclick = spin;
  renderTop(); renderPrizes(); syncWheel(); updateBtn();
}

function renderTop() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === topTab));
  const rows = data.top[topTab];
  $("top").innerHTML = rows.length
    ? rows.map((r, i) => `<div class="top-item${r.me ? " me" : ""}"><span><span class="n">${["🥇", "🥈", "🥉"][i] || (i + 1) + "."}</span>${esc(r.name)}</span><span class="cnt">${r.count}</span></div>`).join("")
    : '<div class="empty">Пока здесь пусто. Оставь комментарий под постом, и ты окажешься первой в списке ✨</div>';
}

function renderPrizes() {
  $("prizes").innerHTML = data.prizes.length
    ? data.prizes.map((p) => `<div class="prize"><span>${esc(p.name)}${p.stock >= 0 ? " <small>(осталось " + p.stock + ")</small>" : ""}</span><span class="pc">${p.chance}%</span></div>`).join("")
    : '<div class="empty">Призы скоро появятся ✨</div>';
}

function updateBtn() { $("spinBtn").disabled = spinning || !data.prizes.length || data.user.points < data.spin_cost; }

function syncWheel() {
  const ids = data.prizes.map((p) => p.id).join(",");
  if (wheelPrizes.map((p) => p.id).join(",") !== ids) wheelPrizes = data.prizes.map((p) => ({ id: p.id, name: p.name }));
  drawWheel();
}

function drawWheel() {
  const c = $("wheel"); if (!c) return;
  const dpr = window.devicePixelRatio || 1, S = 320, r = S / 2;
  c.width = S * dpr; c.height = S * dpr;
  const x = c.getContext("2d"); x.scale(dpr, dpr);
  const n = wheelPrizes.length;
  if (!n) { x.fillStyle = "#FFD6E8"; x.beginPath(); x.arc(r, r, r - 2, 0, 7); x.fill(); return; }
  const seg = (2 * Math.PI) / n;
  wheelPrizes.forEach((p, i) => {
    const a0 = -Math.PI / 2 + i * seg;
    let col = SEG[i % SEG.length];
    if (i === n - 1 && n > 1 && col === SEG[0]) col = SEG[(i + 1) % SEG.length];
    x.beginPath(); x.moveTo(r, r); x.arc(r, r, r - 2, a0, a0 + seg); x.closePath();
    x.fillStyle = col; x.fill();
    x.strokeStyle = "#fff"; x.lineWidth = 3; x.stroke();
    x.save(); x.translate(r, r); x.rotate(a0 + seg / 2);
    x.textAlign = "right"; x.fillStyle = "#7A1C4B"; x.font = '700 14px Comfortaa, "Trebuchet MS", sans-serif';
    const t = p.name.length > 15 ? p.name.slice(0, 14) + "…" : p.name;
    x.fillText(t, r - 40, 5); x.restore();
  });
}

async function spin() {
  if (spinning) return;
  spinning = true; updateBtn(); $("msg").textContent = "";
  let res;
  try { res = await call("/api/spin"); } catch (e) { res = { error: "net", message: "Нет связи с сервером. Попробуй ещё раз." }; }
  if (res.error) { spinning = false; await load(); $("msg").textContent = res.message || "Что-то пошло не так"; return; }
  let idx = wheelPrizes.findIndex((p) => p.id === res.prize.id);
  if (idx < 0) { wheelPrizes.push({ id: res.prize.id, name: res.prize.name }); drawWheel(); idx = wheelPrizes.length - 1; }
  const seg = 360 / wheelPrizes.length, jitter = (Math.random() - 0.5) * seg * 0.6;
  rot = Math.ceil(rot / 360) * 360 + 360 * 6 - (idx + 0.5) * seg + jitter;
  const w = $("wheel");
  w.style.transition = "transform 5s cubic-bezier(.12,.6,.1,1)";
  w.style.transform = `rotate(${rot}deg)`;
  await wait(5300);
  burst();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  spinning = false;
  const prizeText = "💖 Тебе выпало: " + res.prize.name;
  await load();
  $("msg").textContent = prizeText;
}

async function load() {
  try {
    const d = await call("/api/me");
    if (d.error) throw new Error(d.error);
    data = d; loadedAt = Date.now() / 1000;
    render();
  } catch (e) {
    $("app").className = "center";
    $("app").textContent = initData
      ? "Не получилось загрузить данные. Закрой приложение и открой его ещё раз."
      : "Открой это приложение через Telegram-бота: как обычный сайт оно не работает.";
  }
}

buildFx();
load();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (data) drawWheel(); });
setInterval(() => { if (data && !spinning && $("timer")) $("timer").textContent = campaignText(); }, 30000);
</script>
</body>
</html>
