<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Активность канала</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #7d7d7d);
    --card: var(--tg-theme-secondary-bg-color, #f1f3f5);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 40px; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .hint { color: var(--hint); font-size: 14px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .big { font-size: 32px; font-weight: 700; }
  .bar { height: 10px; border-radius: 6px; background: rgba(128,128,128,.25); overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; width: 0; background: var(--btn); transition: width .6s; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 22px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 8px 4px; border: 0; border-radius: 10px; background: transparent;
                 color: var(--text); font-size: 14px; cursor: pointer; }
  .tabs button.on { background: var(--btn); color: var(--btn-text); }
  .top-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(128,128,128,.2); }
  .top-item:last-child { border-bottom: 0; }
  .top-item.me { font-weight: 700; color: var(--btn); }
  .wheel-box { position: relative; width: min(100%, 320px); margin: 6px auto 12px; aspect-ratio: 1; }
  #wheel { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
             border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #e53935; z-index: 2; }
  .hub { position: absolute; top: 50%; left: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
         background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.35); }
  #spinBtn { width: 100%; padding: 14px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 600;
             background: var(--btn); color: var(--btn-text); cursor: pointer; }
  #spinBtn:disabled { opacity: .5; cursor: default; }
  #msg { text-align: center; min-height: 24px; margin-top: 10px; font-weight: 600; }
  .prize { display: flex; justify-content: space-between; padding: 4px 0; }
  .center { text-align: center; padding: 40px 10px; }
</style>
</head>
<body>
<div id="app" class="center hint">Загрузка…</div>

<script>
// ВАШ адрес Worker (без слэша на конце):
const API = "https://patient-term-2e28tg-activity-bot.mpe1425.workers.dev";

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

let data = null, wheelPrizes = [], rot = 0, topTab = "week", loadedAt = 0, spinning = false;

async function call(path) {
  const r = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData }),
  });
  return r.json();
}

function left(sec) {
  if (sec <= 0) return "0 мин";
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  return (d ? d + " д " : "") + (h ? h + " ч " : "") + m + " мин";
}

function campaignText() {
  const c = data.campaign;
  const nowSrv = c.now + (Date.now() / 1000 - loadedAt);
  if (c.active) return "⏳ До конца кампании: " + left(c.end - nowSrv);
  return "Кампания сейчас не идёт: баллы за комментарии не начисляются.";
}

function render() {
  const u = data.user, cost = data.spin_cost, pct = Math.min(100, Math.round((u.points / cost) * 100));
  const need = Math.max(0, cost - u.points);
  $("app").className = "";
  $("app").innerHTML = `
    <h1>Привет, ${esc(u.name || "участник")}!</h1>
    <div class="hint" style="margin-bottom:14px">${esc(campaignText())}</div>

    <div class="card">
      <div class="row"><span class="hint">Ваши баллы</span><span class="hint">Вращение: ${cost}</span></div>
      <div class="big" id="pts">${u.points}</div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="hint">${need ? "Ещё " + need + " балл. до вращения" : "Можно крутить колесо!"}</div>
    </div>

    <div class="card">
      <h2>Ваша активность (комментарии)</h2>
      <div class="stats">
        <div><b>${data.counts.week}</b><span class="hint">7 дней</span></div>
        <div><b>${data.counts.month}</b><span class="hint">30 дней</span></div>
        <div><b>${data.counts.all}</b><span class="hint">всего</span></div>
      </div>
    </div>

    <div class="card">
      <h2>🎡 Колесо призов</h2>
      <div class="wheel-box"><div class="pointer"></div><canvas id="wheel"></canvas><div class="hub"></div></div>
      <button id="spinBtn">Крутить за ${cost} балл.</button>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>🏆 Самые активные</h2>
      <div class="tabs" id="tabs">
        <button data-t="week">7 дней</button><button data-t="month">30 дней</button><button data-t="all">Всё время</button>
      </div>
      <div id="top"></div>
    </div>

    <div class="card">
      <h2>🎁 Призы и шансы</h2>
      <div id="prizes"></div>
    </div>`;

  $("tabs").onclick = (e) => { if (e.target.dataset.t) { topTab = e.target.dataset.t; renderTop(); } };
  $("spinBtn").onclick = spin;
  renderTop();
  renderPrizes();
  syncWheel();
  updateBtn();
}

function renderTop() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === topTab));
  const rows = data.top[topTab];
  $("top").innerHTML = rows.length
    ? rows.map((r, i) => `<div class="top-item${r.me ? " me" : ""}"><span>${["🥇", "🥈", "🥉"][i] || i + 1 + "."} ${esc(r.name)}</span><span>${r.count}</span></div>`).join("")
    : '<div class="hint">Пока нет данных.</div>';
}

function renderPrizes() {
  $("prizes").innerHTML = data.prizes.length
    ? data.prizes.map((p) => `<div class="prize"><span>${esc(p.name)}${p.stock >= 0 ? ' <span class="hint">(осталось ' + p.stock + ")</span>" : ""}</span><span>${p.chance}%</span></div>`).join("")
    : '<div class="hint">Призы пока не добавлены.</div>';
}

function updateBtn() {
  const b = $("spinBtn");
  b.disabled = spinning || !data.prizes.length || data.user.points < data.spin_cost;
}

function syncWheel() {
  const ids = data.prizes.map((p) => p.id).join(",");
  if (wheelPrizes.map((p) => p.id).join(",") !== ids) {
    wheelPrizes = data.prizes.map((p) => ({ id: p.id, name: p.name }));
  }
  drawWheel();
}

function drawWheel() {
  const c = $("wheel"), dpr = window.devicePixelRatio || 1, S = 320;
  c.width = S * dpr; c.height = S * dpr;
  const x = c.getContext("2d");
  x.scale(dpr, dpr);
  const n = wheelPrizes.length, r = S / 2;
  if (!n) { x.fillStyle = "#bbb"; x.beginPath(); x.arc(r, r, r - 4, 0, 7); x.fill(); return; }
  const seg = (2 * Math.PI) / n;
  wheelPrizes.forEach((p, i) => {
    const a0 = -Math.PI / 2 + i * seg;
    x.beginPath(); x.moveTo(r, r); x.arc(r, r, r - 4, a0, a0 + seg); x.closePath();
    x.fillStyle = `hsl(${(i * 360 / n + 20) % 360} 70% 52%)`; x.fill();
    x.strokeStyle = "#fff"; x.lineWidth = 2; x.stroke();
    x.save(); x.translate(r, r); x.rotate(a0 + seg / 2);
    x.textAlign = "right"; x.fillStyle = "#fff"; x.font = "600 14px sans-serif";
    const t = p.name.length > 15 ? p.name.slice(0, 14) + "…" : p.name;
    x.fillText(t, r - 18, 5); x.restore();
  });
}

async function spin() {
  if (spinning) return;
  spinning = true; updateBtn(); $("msg").textContent = "";
  let res;
  try { res = await call("/api/spin"); } catch (e) { res = { error: "net", message: "Нет связи с сервером." }; }
  if (res.error) {
    spinning = false; $("msg").textContent = res.message || "Ошибка"; await load(); return;
  }
  let idx = wheelPrizes.findIndex((p) => p.id === res.prize.id);
  if (idx < 0) { wheelPrizes.push({ id: res.prize.id, name: res.prize.name }); drawWheel(); idx = wheelPrizes.length - 1; }
  const seg = 360 / wheelPrizes.length;
  const jitter = (Math.random() - 0.5) * seg * 0.6;
  rot = Math.ceil(rot / 360) * 360 + 360 * 6 - (idx + 0.5) * seg + jitter;
  const w = $("wheel");
  w.style.transition = "transform 5s cubic-bezier(.12,.6,.1,1)";
  w.style.transform = `rotate(${rot}deg)`;
  await wait(5300);
  $("msg").textContent = "🎉 Вам выпало: " + res.prize.name;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  spinning = false;
  await load();
}

async function load() {
  try {
    const d = await call("/api/me");
    if (d.error) throw new Error(d.error);
    data = d; loadedAt = Date.now() / 1000;
    const msg = $("msg") ? $("msg").textContent : "";
    render();
    if (msg) $("msg").textContent = msg;
  } catch (e) {
    $("app").className = "center hint";
    $("app").innerHTML = initData
      ? "Не удалось загрузить данные. Попробуйте открыть приложение ещё раз."
      : "Откройте это приложение через Telegram-бота, а не как обычный сайт.";
  }
}

load();
setInterval(() => { if (data && !spinning) { const el = document.querySelector("#app .hint"); if (el) el.textContent = campaignText(); } }, 30000);
</script>
</body>
</html>
