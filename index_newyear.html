  .edge.l { left: 0; } .edge.r { right: 0; transform: scaleX(-1); }
  .garland { position: absolute; top: 0; left: 0; right: 0; z-index: 6; pointer-events: none; }
  .gb { animation: gb 1.7s ease-in-out infinite alternate; }
  @keyframes gb { from { opacity: .35; } to { opacity: 1; } }
  #snow { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .sf { position: absolute; top: -12px; border-radius: 50%; background: #fff; opacity: .8; animation: fall linear infinite; }
  @keyframes fall { to { transform: translate3d(var(--dx), 108vh, 0); } }

  /* ---------- карточки ---------- */
  .hero { position: relative; border-radius: 26px; padding: 20px 18px 18px; margin-bottom: 14px;
    background: linear-gradient(135deg, #ab232d 0%, #7d141d 100%); border: 1.6px solid rgba(240, 195, 109, .8);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .2); }
  .hero h1 { margin: 0 0 6px; font: 700 25px/1.18 var(--disp); color: var(--cream); padding-right: 40px; }
  .hero h1 svg { width: 22px; height: 22px; vertical-align: -3px; color: #ff6b78; margin-left: 4px; }
  .hero .sub { font-size: 14px; color: #ffe8d0; padding-right: 40px; }
  .hero .flake { position: absolute; right: 16px; top: 50%; width: 36px; margin-top: -18px; color: #f6d9a0; opacity: .9; }
  .card { position: relative; background: var(--glass); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1.4px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .08); }
  .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--hint); font-weight: 700; }
  .pts { font: 700 46px/1.1 var(--disp); color: var(--cream); display: flex; align-items: center; gap: 8px; margin: 2px 0 0; }
  .pts svg { width: 24px; color: #ff5b6a; }
  .barrow { display: flex; align-items: center; gap: 8px; margin: 12px 0 8px; }
  .barrow .giftb { width: 36px; flex: none; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5)); }
  .bar { position: relative; flex: 1; height: 14px; border-radius: 99px; background: rgba(0, 0, 0, .42); border: 1px solid rgba(240, 195, 109, .38); }
  .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #8e141d, #d6303a 60%, #f0c36d); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .spark { position: absolute; top: 50%; font-size: 20px; line-height: 1; color: #fff2c2; text-shadow: 0 0 8px #ffd27a, 0 0 14px #ffb347; transform: translate(-50%, -52%); transition: left .9s cubic-bezier(.2, .8, .2, 1); }
  .need { font-size: 14px; color: var(--hint); font-weight: 700; }
  .ttl { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font: 700 18px/1.2 var(--disp); color: var(--cream); }
  .ttl svg { width: 20px; color: var(--gold); flex: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: rgba(0, 0, 0, .3); border: 1px solid rgba(240, 195, 109, .3); border-radius: 16px; padding: 12px 6px; text-align: center; }
  .tile b { display: block; font: 700 26px/1.1 var(--disp); color: var(--cream); }
  .tile span { font-size: 13px; color: var(--hint); font-weight: 700; }

  /* ---------- колесо ---------- */
  .stage { position: relative; margin: 8px 0 18px; --wd: min(64vw, 258px); }
  .banner { width: min(92%, 310px); margin: 0 auto 38px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); }

=\"24\" stroke=\"#0b2c1d\" stroke-width=\"2\"/><g style=\"color:#ffd27a\"><circle class=\"gb\" style=\"animation-delay:0.36s\" cx=\"302\" cy=\"30\" r=\"11\" fill=\"url(#gl)\"/><ellipse cx=\"302\" cy=\"29\" rx=\"3.6\" ry=\"5.2\" fill=\"#ffd27a\"/><rect x=\"299.8\" y=\"22.5\" width=\"4.4\" height=\"3\" rx=\"1\" fill=\"#c9a24a\"/></g><line x1=\"338\" y1=\"13\" x2=\"338\" y2=\"18\" stroke=\"#0b2c1d\" stroke-width=\"2\"/><g style=\"color:#7fe0a8\"><circle class=\"gb\" style=\"animation-delay:0.63s\" cx=\"338\" cy=\"24\" r=\"11\" fill=\"url(#gl)\"/><ellipse cx=\"338\" cy=\"23\" rx=\"3.6\" ry=\"5.2\" fill=\"#7fe0a8\"/><rect x=\"335.8\" y=\"16.5\" width=\"4.4\" height=\"3\" rx=\"1\" fill=\"#c9a24a\"/></g><line x1=\"368\" y1=\"12\" x2=\"368\" y2=\"17\" stroke=\"#0b2c1d\" stroke-width=\"2\"/><g style=\"color:#ffe9a8\"><circle class=\"gb\" style=\"animation-delay:0.90s\" cx=\"368\" cy=\"23\" r=\"11\" fill=\"url(#gl)\"/><ellipse cx=\"368\" cy=\"22\" rx=\"3.6\" ry=\"5.2\" fill=\"#ffe9a8\"/><rect x=\"365.8\" y=\"15.5\" width=\"4.4\" height=\"3\" rx=\"1\" fill=\"#c9a24a\"/></g></svg>"};

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0b231b"); tg.setBackgroundColor("#0b231b"); } catch (e) {} }
const initData = tg ? tg.initData : "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };
const BALL = ["балл", "балла", "баллов"];
// [фон сектора, цвет текста, цвет значка, второй цвет значка]
const SEG = [["#a31f29", "#fbf3e4", "#fbf3e4", "#f0c36d"], ["#f3e6cf", "#7d141d", "#b01f28", "#2f6b4c"], ["#1f5a3f", "#fbf3e4", "#f0c36d", "#fbf3e4"]];
const ICONS = ["gift", "cane", "flake", "star", "bell"];

let data = null, wheelPrizes = [], rot = 0, topTab = "week", loadedAt = 0, spinning = false;

// ---------- декор ----------
function buildFx() {
  $("garland").innerHTML = ART.garland;
  const box = $("snow");
  for (let i = 0; i < 34; i++) {
    const s = document.createElement("span"); s.className = "sf";
    const z = 2 + Math.random() * 3;
    s.style.left = Math.random() * 100 + "%"; s.style.width = s.style.height = z + "px";
    s.style.opacity = 0.35 + Math.random() * 0.55;
    s.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
    s.style.animationDuration = 9 + Math.random() * 11 + "s"; s.style.animationDelay = -Math.random() * 18 + "s";
    box.appendChild(s);
  }
}
function burst() {
  if (reduced) return;
  const r = $("wheel").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const g = ["❄", "✦", "★", "❅", "✧", "♥"], col = ["#ffe3a1", "#ffffff", "#ff6b78", "#f0c36d", "#9be3b4"];
  for (let i = 0; i < 30; i++) {
    const s = document.createElement("span"); s.className = "cf"; s.textContent = g[i % g.length]; s.style.color = col[i % col.length];
    const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 160;
    s.style.left = cx + "px"; s.style.top = cy + "px";
    s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d - 40 + "px"); s.style.setProperty("--rot", Math.random() * 160 - 80 + "deg");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1700);
  }
}

// ---------- данные ----------
async function call(path) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData }) });
  return r.json();
}
function left(sec) {
  if (sec <= 0) return "0 мин";
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  return (d ? d + " д " : "") + (h ? h + " ч " : "") + m + " мин";
}
function campaignText() {
  const c = data.campaign, nowSrv = c.now + (Date.now() / 1000 - loadedAt);
  return c.active ? "До конца кампании: " + left(c.end - nowSrv) : "Кампания сейчас не идёт: баллы пока не начисляются";
}

// ---------- экран ----------
function render() {
  const u = data.user, cost = data.spin_cost;
  const pct = Math.min(100, Math.round((u.points / cost) * 100)), need = Math.max(0, cost - u.points);
  const sx = Math.max(3, Math.min(97, pct));
  let bulbs = ""; for (let i = 0; i < 24; i++) bulbs += `<span class="bulb" style="--i:${i}"></span>`;
  $("app").className = "";
  $("app").innerHTML = `
    <section class="hero">
      <div class="flake">${ART.flake}</div>
      <h1>Привет${u.name ? ", " : ""}<span style="white-space:nowrap">${u.name ? esc(u.name) : ""}!${ART.heart}</span></h1>
      <div class="sub" id="timer">${esc(campaignText())}</div>
    </section>

    <section class="card">
      <div class="row"><span>Твои баллы</span><span>Вращение — ${cost} ${plural(cost, BALL)}</span></div>
      <div class="pts">${u.points}${ART.heart}</div>
      <div class="barrow"><div class="giftb">${ART.gift}</div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div><span class="spark" style="left:${sx}%">✦</span></div></div>
      <div class="need">${need ? "Ещё " + need + " " + plural(need, BALL) + ", и можно крутить колесо" : "Можно крутить колесо!"}</div>
    </section>

    <section class="card">
      <h2 class="ttl">${ART.flake} Твои комментарии</h2>
      <div class="stats">
        <div class="tile"><b>${data.counts.week}</b><span>за 7 дней</span></div>
        <div class="tile"><b>${data.counts.month}</b><span>за 30 дней</span></div>
        <div class="tile"><b>${data.counts.all}</b><span>всего</span></div>
      </div>
    </section>

    <section class="stage">
      <div class="banner"><div class="o"><div class="i">${ART.flake}<span>Колесо призов</span>${ART.flake}</div></div></div>
      <div class="wheel-wrap">
        <div class="metal"></div><div class="bulbs">${bulbs}</div>
        <div class="wheel-box"><canvas id="wheel" aria-label="Колесо призов"></canvas><div class="hub">${ART.heart}</div></div>
        <div class="pointer">${ART.pointer}</div>
        <div class="deer">${ART.deer}</div>
        <div class="lantern">${ART.lantern}</div>
        <div class="gifts">${ART.gifts}</div>
      </div>
      <button id="spinBtn" type="button">Крутить колесо за ${cost} ${plural(cost, BALL)}</button>
      <div id="msg" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2 class="ttl">${ART.flake} Самые активные</h2>
      <div class="tabs" id="tabs">
        <button type="button" data-t="week">7 дней</button><button type="button" data-t="month">30 дней</button><button type="button" data-t="all">Всё время</button>
      </div>
      <div id="top"></div>
    </section>

    <section class="card">
      <h2 class="ttl">${ART.flake} Призы и шансы</h2>
      <div id="prizes"></div>
    </section>
    <div class="ground">${ART.mound}</div>`;

  $("tabs").onclick = (e) => { if (e.target.dataset.t) { topTab = e.target.dataset.t; renderTop(); } };
  $("spinBtn").onclick = spin;
  renderTop(); renderPrizes(); syncWheel(); updateBtn();
}
function renderTop() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === topTab));
  const rows = data.top[topTab];
  $("top").innerHTML = rows.length
    ? rows.map((r, i) => `<div class="top-item${r.me ? " me" : ""}"><span><span class="medal ${i < 3 ? "m" + (i + 1) : ""}">${i + 1}</span>${esc(r.name)}</span><span class="cnt">${r.count}</span></div>`).join("")
    : '<div class="empty">Пока здесь пусто. Оставь комментарий под постом, и ты окажешься первым в списке</div>';
}
function renderPrizes() {
  $("prizes").innerHTML = data.prizes.length
    ? data.prizes.map((p) => `<div class="prize"><span>${esc(p.name)}${p.stock >= 0 ? " <small>(осталось " + p.stock + ")</small>" : ""}</span><span class="pc">${p.chance}%</span></div>`).join("")
    : '<div class="empty">Призы скоро появятся</div>';
}
function updateBtn() { $("spinBtn").disabled = spinning || !data.prizes.length || data.user.points < data.spin_cost; }

// ---------- колесо ----------
function syncWheel() {
  const ids = data.prizes.map((p) => p.id).join(",");
  if (wheelPrizes.map((p) => p.id).join(",") !== ids) wheelPrizes = data.prizes.map((p) => ({ id: p.id, name: p.name }));
  drawWheel();
}
function drawIcon(x, kind, s, col, alt) {
  x.save(); x.fillStyle = col; x.strokeStyle = col; x.lineCap = "round"; x.lineJoin = "round";
  if (kind === "gift") {
    x.fillRect(-s, -s * .5, 2 * s, 1.5 * s); x.fillStyle = alt; x.fillRect(-s * .2, -s * .5, s * .4, 1.5 * s);
    x.fillStyle = col; x.fillRect(-s * 1.1, -s * .9, 2.2 * s, s * .5); x.fillStyle = alt; x.fillRect(-s * .2, -s * .9, s * .4, s * .5);
    x.fillStyle = col; x.beginPath(); x.ellipse(-s * .45, -s * 1.2, s * .45, s * .28, -.5, 0, 7); x.ellipse(s * .45, -s * 1.2, s * .45, s * .28, .5, 0, 7); x.fill();
  } else if (kind === "cane") {
    x.lineWidth = s * .55; x.beginPath(); x.moveTo(-s * .2, s * 1.1); x.lineTo(-s * .2, -s * .4); x.arc(s * .4, -s * .4, s * .6, Math.PI, 0); x.stroke();
    x.strokeStyle = alt; x.lineWidth = s * .2;
    for (let k = 0; k < 4; k++) { x.beginPath(); x.moveTo(-s * .5, s * (.9 - k * .4)); x.lineTo(s * .1, s * (.6 - k * .4)); x.stroke(); }
  } else if (kind === "flake") {
    x.lineWidth = s * .22;
    for (let k = 0; k < 3; k++) {
      x.save(); x.rotate(k * Math.PI / 3); x.beginPath(); x.moveTo(0, -s * 1.1); x.lineTo(0, s * 1.1);
      x.moveTo(-s * .35, -s * .7); x.lineTo(0, -s * .35); x.lineTo(s * .35, -s * .7); x.moveTo(-s * .35, s * .7); x.lineTo(0, s * .35); x.lineTo(s * .35, s * .7); x.stroke(); x.restore();
    }
  } else if (kind === "star") {
    x.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? s * .5 : s * 1.15, a = -Math.PI / 2 + k * Math.PI / 5; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); } x.closePath(); x.fill();
  } else if (kind === "bell") {
    x.beginPath(); x.moveTo(-s * .95, s * .7); x.quadraticCurveTo(-s * .9, -s * .2, -s * .55, -s * .65); x.quadraticCurveTo(0, -s * 1.2, s * .55, -s * .65);
    x.quadraticCurveTo(s * .9, -s * .2, s * .95, s * .7); x.closePath(); x.fill();
    x.fillStyle = alt; x.beginPath(); x.arc(0, s * .95, s * .28, 0, 7); x.fill();
  }
  x.restore();
}
function drawWheel() {
  const c = $("wheel"); if (!c) return;
  const dpr = window.devicePixelRatio || 1, S = 320, r = S / 2;
  c.width = S * dpr; c.height = S * dpr;
  const x = c.getContext("2d"); x.scale(dpr, dpr);
  const n = wheelPrizes.length;
  if (!n) { x.fillStyle = "#1f5a3f"; x.beginPath(); x.arc(r, r, r - 2, 0, 7); x.fill(); return; }
  const seg = (2 * Math.PI) / n, fam = '"Nunito", "Trebuchet MS", sans-serif', maxW = (r - 50) - 44;
  wheelPrizes.forEach((p, i) => {
    let ci = i % 3; if (i === n - 1 && n > 1 && ci === 0) ci = 1;
    const sc = SEG[ci], a0 = -Math.PI / 2 + i * seg;
    x.beginPath(); x.moveTo(r, r); x.arc(r, r, r - 2, a0, a0 + seg); x.closePath(); x.fillStyle = sc[0]; x.fill();
    x.strokeStyle = "rgba(240,195,109,.9)"; x.lineWidth = 2; x.stroke();
    x.save(); x.translate(r, r); x.rotate(a0 + seg / 2);
    x.save(); x.translate(r - 32, 0); x.rotate(Math.PI / 2); drawIcon(x, ICONS[i % ICONS.length], 8.5, sc[2], sc[3]); x.restore();
    let fs = 12, t = p.name; x.font = `800 ${fs}px ${fam}`; x.textAlign = "right"; x.fillStyle = sc[1];
    while (fs > 9 && x.measureText(t).width > maxW) { fs--; x.font = `800 ${fs}px ${fam}`; }
    if (x.measureText(t).width > maxW) { while (t.length > 2 && x.measureText(t + "…").width > maxW) t = t.slice(0, -1); t += "…"; }
    x.fillText(t, r - 50, 4); x.restore();
  });
}
async function spin() {
  if (spinning) return;
  spinning = true; updateBtn(); $("msg").textContent = "";
  let res;
  try { res = await call("/api/spin"); } catch (e) { res = { error: "net", message: "Нет связи с сервером. Попробуй ещё раз." }; }
  if (res.error) { spinning = false; await load(); $("msg").textContent = res.message || "Что-то пошло не так"; return; }
  let idx = wheelPrizes.findIndex((p) => p.id === res.prize.id);
  if (idx < 0) { wheelPrizes.push({ id: res.prize.id, name: res.prize.name }); drawWheel(); idx = wheelPrizes.length - 1; }
  const seg = 360 / wheelPrizes.length, jitter = (Math.random() - 0.5) * seg * 0.6;
  rot = Math.ceil(rot / 360) * 360 + 360 * 6 - (idx + 0.5) * seg + jitter;
  const w = $("wheel"); w.style.transition = "transform 5s cubic-bezier(.12,.6,.1,1)"; w.style.transform = `rotate(${rot}deg)`;
  await wait(5300);
  burst();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  spinning = false;
  const prizeText = "Тебе выпало: " + res.prize.name + "!";
  await load();
  $("msg").textContent = prizeText;
}
async function load() {
  try {
    const d = await call("/api/me");
    if (d.error) throw new Error(d.error);
    data = d; loadedAt = Date.now() / 1000; render();
  } catch (e) {
    $("app").className = "center";
    $("app").textContent = initData ? "Не получилось загрузить данные. Закрой приложение и открой его ещё раз." : "Открой это приложение через Telegram-бота: как обычный сайт оно не работает.";
  }
}
buildFx(); load();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (data) drawWheel(); });
setInterval(() => { if (data && !spinning && $("timer")) $("timer").textContent = campaignText(); }, 30000);
</script>
